{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $samplerQueryNames := "active_users|active_workspaces|task_queued|task_running|task_stuck|runtime_online|runtime_heartbeat_age|workspace_total" -}}
{{- $samplerErrorNames := printf "acquire|%s" $samplerQueryNames -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "multica.backend.fullname" . }}-sampler
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: multica-business-sampler
      rules:
        - alert: OrchestratorHeartbeatMissing
          expr: absent(multica_orchestrator_heartbeat_timestamp_seconds)
          for: 5m
          labels:
            severity: critical
            service: multica-orchestrator
            expected_instance: {{ .Values.monitoring.prometheusRule.heartbeatExpectedInstance | quote }}
          annotations:
            summary: "Multica orchestrator heartbeat is missing"
            description: "The orchestrator metrics target is not exporting its heartbeat gauge."
        - alert: OrchestratorHeartbeatStale
          expr: time() - multica_orchestrator_heartbeat_timestamp_seconds > {{ .Values.monitoring.prometheusRule.heartbeatStaleSeconds }}
          for: 1m
          labels:
            severity: critical
            service: multica-orchestrator
          annotations:
            summary: "Multica orchestrator heartbeat is stale"
            description: "The orchestrator heartbeat has not advanced within the expected interval."
        - alert: OrchestratorHeartbeatWriteFailing
          expr: increase(multica_orchestrator_heartbeat_write_failures_total[5m]) > 0
          for: 2m
          labels:
            severity: critical
            service: multica-orchestrator
          annotations:
            summary: "Multica orchestrator heartbeat writes are failing"
            description: "The orchestrator is reporting failures while exporting heartbeat telemetry."
        - alert: MulticaBusinessSamplerQueryErrors
          expr: |
            sum by (name) (
              rate(multica_business_sampler_query_errors_total{name=~"{{ $samplerErrorNames }}"}[10m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.samplerQueryErrorsFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query errors"
            description: "Business sampler query {{ "{{ $labels.name }}" }} is returning errors. Metrics may go stale if the query keeps timing out."
        - alert: MulticaBusinessSamplerQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, name) (
                rate(multica_business_sampler_query_seconds_bucket{name=~"{{ $samplerQueryNames }}"}[10m])
              )
            ) > 0.3
          for: {{ .Values.monitoring.prometheusRule.samplerQueryLatencyFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query p95 is high"
            description: "Business sampler query {{ "{{ $labels.name }}" }} p95 is above 300ms, leaving little headroom before the 500ms statement_timeout."
{{- end }}
