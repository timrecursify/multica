# Developer-only database. All worktrees intentionally share this one local
# PostgreSQL container while using separate database names. Keep this project
# name distinct from the production/self-host project ("multica") so a dev
# checkout's normal reconciliation cannot replace production resources.
name: multica-dev

services:
  dev-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

volumes:
  dev_pgdata:
