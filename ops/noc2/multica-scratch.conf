# GSP belt scratch is high-churn and must not inherit /usr/lib/tmpfiles.d/tmp.conf's
# 30-day retention.  Keep the safety buffer for files belonging to active tasks;
# tmpfiles only removes entries older than the age below.
D /tmp/multica-task-* 0755 newadmin newadmin 2h
D /tmp/sk-multica-qc.* 0755 newadmin newadmin 2h
D /tmp/qc* 0755 newadmin newadmin 2h
D /tmp/pppqc 0755 newadmin newadmin 2h
