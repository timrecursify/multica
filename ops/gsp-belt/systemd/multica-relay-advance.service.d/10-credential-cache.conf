# ProtectSystem=strict left the whole tree read-only, so
# /usr/local/bin/gsp-belt-git-credential could not write its token cache
# (${HOME}/.cache/gsp-belt-git-token). It runs set -euo pipefail, so the failed
# write aborted the mint and every gh call fell back to unauthenticated. That
# defeated the GitHub App token wiring in multica PRs #583 and #586.
# gsp-multica-worker.service already grants the whole of /var/lib/gsp-multica;
# this is the same grant narrowed to the cache directory.
[Service]
ReadWritePaths=/var/lib/gsp-multica/.cache
