# ProtectSystem=strict mounts / read-only, and this unit had no /tmp override,
# so the daemon's per-task scratch dir (mkdir /tmp/multica-task-<n>) failed with
# 'read-only file system' after the model had already been paid for.
# gsp-multica-worker.service carries the identical grant (privatetmp.conf,
# added 2026-09-06 06:18:29Z); this is that same grant on the ppp twin.
[Service]
PrivateTmp=yes
