[Service]
# Belt agents call `sk multica qc-checkout` and the scoped-token `gh` shim.
# Both live in /usr/local/lib/gsp-belt/bin. gsp-multica-worker.service already
# carries this PATH; this unit did not, so every ppp agent step invoking sk
# failed with 'sk: command not found' while the gsp board worked. See GSP-2346.
Environment=PATH=/usr/local/lib/gsp-belt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
