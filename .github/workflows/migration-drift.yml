name: Migration drift sentinel

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Audit deployed database
        env:
          DATABASE_URL: ${{ secrets.GSP_DATABASE_URL }}
        run: ./scripts/check-migration-drift.sh
